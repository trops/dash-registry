version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # `npm install` (not `npm ci`) — vitest's transitive
            # @rolldown/binding-wasm32-wasi pulls in wasm-CPU optional deps
            # that npm on macOS won't lock, so strict `npm ci` fails on
            # Linux. See dash-registry PR #61.
            - npm install --no-audit --no-fund
        build:
          commands:
            - npm run build
        postBuild:
          commands:
            - node scripts/migrate-to-dynamo.js || echo "Migration skipped (no AWS credentials or tables)"
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: .
    # NOTE: No `backend:` phase here. This app's backend (Cognito User Pool,
    # DynamoDB tables, S3 storage) lives in a local SANDBOX stack
    # (`amplify-dashregistry-johngiatropoulos-sandbox-e718e335ed`) originally
    # deployed via `npx ampx sandbox`, not a pipeline-deploy stack. Adding
    # `npx ampx pipeline-deploy --branch main` here would create a PARALLEL
    # production stack with a new User Pool ID and orphan every existing
    # user's data. Until the sandbox → pipeline migration is planned and
    # executed (out of scope for backend.ts tweaks), backend changes must
    # be applied locally with `npx ampx sandbox` by a developer whose AWS
    # credentials match the sandbox IAM identity.
