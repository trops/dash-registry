version: 1
applications:
  - backend:
      phases:
        build:
          commands:
            # Amplify Gen 2 backend deploy. Runs CDK synth + CloudFormation
            # for everything defined in /amplify (auth, storage,
            # backend.ts with its CDK escape hatches). Without this phase,
            # backend.ts changes never take effect — the frontend-only
            # version of this file was silently leaving Cognito / IAM /
            # DynamoDB out of the deploy pipeline.
            #
            # Use `npm install --no-audit --no-fund` (not `npm ci`) for
            # the same reason the frontend phase does — see PR #61 —
            # transitive wasm-CPU optional deps aren't strictly lockable
            # across macOS dev + Linux CI, and `npm ci` rejects the
            # cross-platform drift.
            - npm install --no-audit --no-fund
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            # `npm install` (not `npm ci`) — vitest's transitive
            # @rolldown/binding-wasm32-wasi pulls in wasm-CPU optional deps
            # that npm on macOS won't lock, so strict `npm ci` fails on
            # Linux. See dash-registry PR #61.
            - npm install --no-audit --no-fund
        build:
          commands:
            - npm run build
        postBuild:
          commands:
            - node scripts/migrate-to-dynamo.js || echo "Migration skipped (no AWS credentials or tables)"
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: .
